name: Deploy

on:
  workflow_call:
    inputs:
      carl_tag:
        description: "Carl git tag to use"
        type: string
        default: "master"
      nr_jobs:
        description: "Number of parallel build jobs"
        type: string
        default: "4"
      buildType:
        description: "Build type name (Debug or Release)"
        type: string
        required: true
      dockerTag:
        description: "Docker image tag to use (e.g. ci-debug, ci)"
        type: string
        required: true
      baseImg:
        description: "Base image name (e.g. storm-dependencies:latest)"
        type: string
        default: "storm-dependencies:latest"
      Developer:
        description: "Enable developer mode"
        type: boolean
        default: false
      cmakeArgs:
        description: "Extra CMake arguments"
        type: string
        default: ""
    secrets:
      STORM_CI_DOCKER_USERNAME:
        required: false
      STORM_CI_DOCKER_TOKEN:
        required: false

jobs:
  deploy:
    name: Test and Deploy (${{ inputs.buildType }}, ${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {name: linux/amd64, suffix: amd64, runner: ubuntu-latest}
          - {name: linux/arm64, suffix: arm64, runner: ubuntu-24.04-arm}
    env:
      NR_JOBS: ${{ inputs.nr_jobs }}
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Git describe
        id: ghd
        uses: proudust/gh-describe@v3
      - name: Set static Storm version
        run: echo "set(STORM_VERSION_COMMITS_AHEAD ${{ steps.ghd.outputs.distance }})" >> version.cmake
      - name: Build storm from Dockerfile
        run: |
          docker build -t movesrwth/storm:${{ inputs.dockerTag }} . \
            --build-arg BASE_IMAGE=movesrwth/${{ inputs.baseImg }} \
            --build-arg build_type="${{ inputs.buildType }}" \
            --build-arg carl_tag="${{ inputs.carl_tag }}" \
            --build-arg developer="${{ inputs.Developer && 'ON' || 'OFF' }}" \
            --build-arg cmake_args="${{ inputs.cmakeArgs }}" \
            --build-arg no_threads=${NR_JOBS}
            # Omitting arguments disable_*, cln_exact, cln_ratfunc, all_sanitizers
      - name: Run Docker
        run: docker run -d -it --name ci movesrwth/storm:${{ inputs.dockerTag }}
      - name: Check compile flags
        uses: ./.github/actions/check-compile-flags-action
        with:
          buildType: ${{ inputs.buildType }}
          docker: true
      - name: Run tests
        run: docker exec ci bash -c "cd /opt/storm/build; ctest --output-on-failure"
      - name: Build starter-project
        uses: ./.github/actions/starter-project-action
        with:
          docker: true
          stormDir: "/opt/storm/build"
          command: "/opt/storm/resources/examples/testfiles/dtmc/brp-16-2.pm 'P=? [F s=5]'"
      - name: Install storm
        run: docker exec ci bash -c "cd /opt/storm/build; make install"
      - name: Temporarily move build dir
        run: |
          docker exec ci bash -c "mv /opt/storm/build /opt/storm/build-backup"
      - name: Run installed storm
        run: |
          docker exec ci bash -c "/usr/local/bin/storm --version"
      - name: Build starter-project on installed Storm
        uses: ./.github/actions/starter-project-action
        with:
          docker: true
          stormDir: ""
          command: "/opt/storm/resources/examples/testfiles/dtmc/brp-16-2.pm 'P=? [F s=5]'"
      - name: Restore build dir
        run: |
          docker exec ci bash -c "mv /opt/storm/build-backup /opt/storm/build"
      - name: Login into docker
        # Only login if using master on original repo (and not for pull requests or forks)
        if: github.repository_owner == 'stormchecker' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.STORM_CI_DOCKER_USERNAME }}
          password: ${{ secrets.STORM_CI_DOCKER_TOKEN }}
      - name: Deploy storm
        # Only deploy if using master on original repo (and not for pull requests or forks)
        if: github.repository_owner == 'stormchecker' && github.ref == 'refs/heads/master'
        run: |
          # Tag with the commit so concurrent master runs cannot overwrite each other's images
          docker commit ci movesrwth/storm:${{ inputs.dockerTag }}-${{ matrix.platform.suffix }}-${{ github.sha }}
          docker push movesrwth/storm:${{ inputs.dockerTag }}-${{ matrix.platform.suffix }}-${{ github.sha }}

  merge:
    name: Publish multi-arch image (${{ inputs.dockerTag }})
    needs: deploy
    # Only publish if using master on original repo (and not for pull requests or forks)
    if: github.repository_owner == 'stormchecker' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Serialize promotion of the stable tag
    concurrency:
      group: storm-docker-promote-${{ inputs.dockerTag }}
      cancel-in-progress: false
    steps:
      - name: Check that this commit is still the head of master
        id: head
        run: |
          latest=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/master | cut -f1)
          if [ "$latest" = "${{ github.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer commit exists on master, not updating ${{ inputs.dockerTag }}"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login into docker
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.STORM_CI_DOCKER_USERNAME }}
          password: ${{ secrets.STORM_CI_DOCKER_TOKEN }}
      - name: Create multi-arch manifest and push
        if: steps.head.outputs.current == 'true'
        run: |
          docker buildx imagetools create -t movesrwth/storm:${{ inputs.dockerTag }} \
            movesrwth/storm:${{ inputs.dockerTag }}-amd64-${{ github.sha }} \
            movesrwth/storm:${{ inputs.dockerTag }}-arm64-${{ github.sha }}
      - name: Inspect image
        if: steps.head.outputs.current == 'true'
        run: docker buildx imagetools inspect movesrwth/storm:${{ inputs.dockerTag }}
